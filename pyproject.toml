[project]
name = "treadmill"
version = "0.1.0"
description = "Compare estimated productivity while walking vs sitting, from ActivityWatch data"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
treadmill = "treadmill.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treadmill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
